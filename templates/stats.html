<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Usage Stats | FPL Hype Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Barlow', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .back-btn { display: inline-flex; gap: 6px; margin-bottom: 24px; text-decoration: none; color: #58a6ff; font-size: 14px; font-weight: 600; }
        h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 2rem; margin-bottom: 20px; }
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin: 24px 0 12px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
        td, th { padding: 8px 14px; text-align: left; border-bottom: 1px solid #21262d; font-size: 14px; }
        th { color: #8b949e; font-size: 12px; text-transform: uppercase; }
        .total { font-size: 1.5em; font-weight: 800; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-btn">← Back to Dashboard</a>
    <h1>Usage Stats</h1>
    <p class="total">{{ total_requests }} total requests logged</p>

    <h2>Top Pages</h2>
    <table>
        <tr><th>Path</th><th>Hits</th></tr>
        {% for path, count in top_paths %}
        <tr><td>{{ path }}</td><td>{{ count }}</td></tr>
        {% endfor %}
    </table>

    <h2>Top Searches</h2>
    <table>
        <tr><th>Query</th><th>Hits</th></tr>
        {% for q, count in top_searches %}
        <tr><td>{{ q }}</td><td>{{ count }}</td></tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
